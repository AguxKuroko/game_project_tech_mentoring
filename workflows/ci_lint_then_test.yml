name: CI - Lint -> Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "poetry"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install

      - name: Run Ruff (lint)
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .

      - name: Run mypy # checks types,function signatures,return values
        run: poetry run mypy .

  tests:
    runs-on: ubuntu-latest

    needs: quality-check # will runn only if job before ends succefully

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "poetry"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install

      - name: Run pytest
        if: hashFiles('**/test_*.py') != '' # if tests exsists run them if no skip
        run: |
          echo "Tests detected, running pytest"
          poetry run pytest --cov=app --cov-report=term-missing
