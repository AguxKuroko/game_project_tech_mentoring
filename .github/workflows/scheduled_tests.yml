# Scheduled Test Pipeline
# Runs pytest automatically about every 14 days at 9:00 AM UTC.
# Purpose: catch silent breakages — if RAWG or OpenAI change their API responses,
# or if a dependency update breaks something, this catches it
# even when no code changes are being made.
# Can also be triggered manually from the GitHub Actions UI via workflow_dispatch.

name: Scheduled Tests

on:
  # Runs at 9:00 AM UTC on the 1st, 15th, and 29th of each month (~every 14 days)
  # Cron format: minute hour day-of-month month day-of-week
  schedule:
    - cron: "0 9 */14 * *"
  workflow_dispatch:

# Same as the CI pipeline: pin the Python version once and reuse it
env:
  PYTHON_VERSION: "3.14"

jobs:
  scheduled-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "poetry"

      - name: Check Poetry installation
        run: poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pytest
        if: hashFiles('**/test_*.py') != ''
        run: |
          set +e
          poetry run pytest --tb=short
          EXIT=$?
          set -e
          if [ "$EXIT" = "5" ]; then
            echo "No tests collected — none exist on this branch yet."
            exit 0
          fi
          exit $EXIT
