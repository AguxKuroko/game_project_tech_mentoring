# Scheduled Test Pipeline
# Runs the (mocked) test suite automatically about every 14 days at 9:00 AM UTC.
# Purpose: catch breakages that appear with no code change — e.g. a transitive
# dependency update, or a runner/Python change that breaks our tests.
# NOTE: these tests MOCK RAWG and OpenAI, so this does NOT detect real upstream
# API changes.
# Can also be triggered manually from the GitHub Actions UI via workflow_dispatch.

name: Scheduled Tests

on:
  # Runs at 9:00 AM UTC on the 1st, 15th, and 29th of each month (~every 14 days)
  # Cron format: minute hour day-of-month month day-of-week
  schedule:
    - cron: "0 9 */14 * *"
  workflow_dispatch:

# Same as the CI pipeline: pin the Python version once and reuse it
env:
  PYTHON_VERSION: "3.14"

jobs:
  scheduled-tests:
    runs-on: ubuntu-latest
    env:
      RAWG_API_KEY: "ci-fake-key"
      OPEN_AI_API_KEY: "ci-fake-key"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "poetry"

      - name: Check Poetry installation
        run: poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pytest
        if: hashFiles('**/test_*.py') != ''
        run: |
          set +e
          poetry run pytest --tb=short
          EXIT=$?
          set -e
          if [ "$EXIT" = "5" ]; then
            echo "No tests collected — none exist on this branch yet."
            exit 0
          fi
          exit $EXIT
