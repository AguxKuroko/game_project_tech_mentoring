name: Scheduled Tests

on:
  schedule:
    - cron: "0 9 */14 * *"
  workflow_dispatch:

jobs:
  scheduled-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "poetry"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Check Poetry installation
        run: poetry --version

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run pytest
        if: hashFiles('**/test_*.py') != ''
        run: |
          set +e
          poetry run pytest --tb=short
          EXIT=$?
          set -e
          if [ "$EXIT" = "5" ]; then
            echo "⚠️ No tests collected — none exist on this branch yet."
            exit 0
          fi
          exit $EXIT
