[project]
name = "worst-games-memed"
version = "0.1.0"
description = "Pick a year, receive a cursed AI meme about the worst-rated game of that year. RAWG API + OpenAI image generation."
authors = [
    { name = "Agnieszka", email = "145929660+AguxKuroko@users.noreply.github.com" }
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard] (>=0.135.1,<0.136.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "uvicorn[standard] (>=0.30.0,<0.31.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "openai (>=2.28.0,<3.0.0)",
    "sqlmodel (>=0.0.37,<0.0.38)",
    "logfire[fastapi] (>=4.32.1,<5.0.0)",
    "streamlit (>=1.57.0,<2.0.0)"
]


[tool.poetry]
packages = [{include = "app"}]

[tool.ruff]
line-length = 180

[tool.ruff.lint]
select = ["E", "F", "B", "N", "UP", "I"]
ignore = ["B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pre-commit = "^3.7"
ruff = "^0.15.5"
mypy = "^2.0.0"


[tool.pytest.ini_options]
addopts = "-v"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
